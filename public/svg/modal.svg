<svg width="600" height="360" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background gradient -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2c3440" />
            <stop offset="100%" stop-color="#1b212a" />
        </linearGradient>

        <!-- Subtle inner glow -->
        <radialGradient id="innerGlow" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>

        <!-- Border gradient -->
        <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8aa0b8" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#5f6f82" stop-opacity="0.3" />
        </linearGradient>

        <!-- Soft shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
        </filter>
    </defs>

    <!-- Modal group -->
    <g filter="url(#shadow)">

        <!-- Base panel -->
        <rect x="20" y="20" width="560" height="320" rx="24" ry="24"
            fill="url(#bgGrad)" />

        <!-- Inner glow overlay -->
        <rect x="20" y="20" width="560" height="320" rx="24" ry="24"
            fill="url(#innerGlow)" />

        <!-- Border -->
        <rect x="20.5" y="20.5" width="559" height="319" rx="24" ry="24"
            fill="none"
            stroke="url(#borderGrad)"
            stroke-width="1.5" />

    </g>
</svg>